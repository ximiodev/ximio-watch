# Persistent, resource-constrained demonstration stack for a shared VPS.
# This is not the final production deployment. All published ports are loopback
# only and all storage is project-scoped. Start with `docker compose -f
# docker-compose.shared-demo.yml --env-file <private-env-file> up -d --build`.
name: ximiowatch-demo

x-shared-logging: &shared-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-shared-restart: &shared-restart
  unless-stopped

services:
  ximiowatch:
    build:
      context: .
      dockerfile: Dockerfile
    restart: *shared-restart
    environment:
      XIMIOWATCH_CONFIG: /app/config/monitors.runtime.yaml
      DEMO_API_URL: http://demo-api:8001
      DEMO_TOKEN: ${SHARED_DEMO_TOKEN:-demo-token}
      OTEL_SERVICE_NAME: ximiowatch
    volumes:
      - ${SHARED_MONITOR_CONFIG:-./config/monitors.yaml}:/app/config/monitors.runtime.yaml:ro
    ports:
      - "127.0.0.1:${SHARED_XIMIOWATCH_PORT:-18100}:8000"
    deploy:
      resources:
        limits:
          cpus: "${SHARED_XIMIOWATCH_CPUS:-0.20}"
          memory: ${SHARED_XIMIOWATCH_MEMORY:-192M}
          pids: ${SHARED_XIMIOWATCH_PIDS_LIMIT:-128}
        reservations:
          memory: ${SHARED_XIMIOWATCH_MEMORY_RESERVATION:-128M}
    mem_limit: ${SHARED_XIMIOWATCH_MEMORY:-192M}
    mem_reservation: ${SHARED_XIMIOWATCH_MEMORY_RESERVATION:-128M}
    cpus: ${SHARED_XIMIOWATCH_CPUS:-0.20}
    pids_limit: ${SHARED_XIMIOWATCH_PIDS_LIMIT:-128}
    logging: *shared-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared-demo
    depends_on:
      demo-api:
        condition: service_healthy

  demo-api:
    build:
      context: .
      dockerfile: Dockerfile.demo
    restart: *shared-restart
    ports:
      - "127.0.0.1:${SHARED_DEMO_API_PORT:-18101}:8001"
    deploy:
      resources:
        limits:
          cpus: "${SHARED_DEMO_API_CPUS:-0.10}"
          memory: ${SHARED_DEMO_API_MEMORY:-96M}
          pids: ${SHARED_DEMO_API_PIDS_LIMIT:-64}
        reservations:
          memory: ${SHARED_DEMO_API_MEMORY_RESERVATION:-64M}
    mem_limit: ${SHARED_DEMO_API_MEMORY:-96M}
    mem_reservation: ${SHARED_DEMO_API_MEMORY_RESERVATION:-64M}
    cpus: ${SHARED_DEMO_API_CPUS:-0.10}
    pids_limit: ${SHARED_DEMO_API_PIDS_LIMIT:-64}
    logging: *shared-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared-demo

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: *shared-restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SHARED_PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${SHARED_PROMETHEUS_RETENTION_SIZE:-512MB}
    volumes:
      - ./prometheus/prometheus.shared-demo.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${SHARED_PROMETHEUS_PORT:-19090}:9090"
    deploy:
      resources:
        limits:
          cpus: "${SHARED_PROMETHEUS_CPUS:-0.25}"
          memory: ${SHARED_PROMETHEUS_MEMORY:-320M}
          pids: ${SHARED_PROMETHEUS_PIDS_LIMIT:-256}
        reservations:
          memory: ${SHARED_PROMETHEUS_MEMORY_RESERVATION:-192M}
    mem_limit: ${SHARED_PROMETHEUS_MEMORY:-320M}
    mem_reservation: ${SHARED_PROMETHEUS_MEMORY_RESERVATION:-192M}
    cpus: ${SHARED_PROMETHEUS_CPUS:-0.25}
    pids_limit: ${SHARED_PROMETHEUS_PIDS_LIMIT:-256}
    logging: *shared-logging
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shared-demo
    depends_on:
      ximiowatch:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4.16@sha256:982fa6bf18cc38280a30bf08c3b673486067d4805b25a9d4756688a689a993c7
    restart: *shared-restart
    environment:
      GF_SECURITY_ADMIN_USER: ${SHARED_GRAFANA_ADMIN_USER:?SHARED_GRAFANA_ADMIN_USER must be set in the private env file}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${SHARED_GRAFANA_PASSWORD_FILE:?SHARED_GRAFANA_PASSWORD_FILE must be set in the private env file}:/run/secrets/grafana_admin_password:ro
    ports:
      - "127.0.0.1:${SHARED_GRAFANA_PORT:-13000}:3000"
    deploy:
      resources:
        limits:
          cpus: "${SHARED_GRAFANA_CPUS:-0.30}"
          memory: ${SHARED_GRAFANA_MEMORY:-320M}
          pids: ${SHARED_GRAFANA_PIDS_LIMIT:-256}
        reservations:
          memory: ${SHARED_GRAFANA_MEMORY_RESERVATION:-192M}
    mem_limit: ${SHARED_GRAFANA_MEMORY:-320M}
    mem_reservation: ${SHARED_GRAFANA_MEMORY_RESERVATION:-192M}
    cpus: ${SHARED_GRAFANA_CPUS:-0.30}
    pids_limit: ${SHARED_GRAFANA_PIDS_LIMIT:-256}
    logging: *shared-logging
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shared-demo
    depends_on:
      prometheus:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.35.1@sha256:4e3d029e69c7f61dd53a2b31a3dc427a2b81736cffca185c0854075e07969e36
    restart: *shared-restart
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.shared-demo.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${SHARED_ALERTMANAGER_PORT:-19093}:9093"
    deploy:
      resources:
        limits:
          cpus: "${SHARED_ALERTMANAGER_CPUS:-0.10}"
          memory: ${SHARED_ALERTMANAGER_MEMORY:-96M}
          pids: ${SHARED_ALERTMANAGER_PIDS_LIMIT:-64}
        reservations:
          memory: ${SHARED_ALERTMANAGER_MEMORY_RESERVATION:-64M}
    mem_limit: ${SHARED_ALERTMANAGER_MEMORY:-96M}
    mem_reservation: ${SHARED_ALERTMANAGER_MEMORY_RESERVATION:-64M}
    cpus: ${SHARED_ALERTMANAGER_CPUS:-0.10}
    pids_limit: ${SHARED_ALERTMANAGER_PIDS_LIMIT:-64}
    logging: *shared-logging
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9093/-/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared-demo

networks:
  shared-demo:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
