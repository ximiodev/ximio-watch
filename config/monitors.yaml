# All values are fictional demonstration data.
# ${VAR} / ${VAR:default} references are resolved from environment variables.
#
# Health states: up, down, unknown (configured but not evaluated) and
# not_configured (no applicable assertion). HTTP-only monitors are valid: their
# functional and performance dimensions are not_configured. A silent application
# failure requires HTTP up plus a confirmed functional down.
#
# Assertions are declarative. Text comparisons are case-sensitive;
# content_type_contains is case-insensitive. Text/HTML checks inspect the returned
# body only; no browser JavaScript is executed. Body assertions are rejected for
# HEAD monitors, including inside conditionals. http_status is top-level only.

monitors:
  - name: restaurant_catalog
    application: demo-kitchen
    url: "${DEMO_API_URL:http://localhost:8001}/scenarios/restaurant-catalog"
    method: GET
    headers:
      X-Demo-Token: "${DEMO_TOKEN:demo-token}"
    interval_seconds: 10
    timeout_seconds: 2
    max_response_bytes: 2097152  # 2 MiB decoded body limit (default)
    assertions:
      - type: http_status
        value: 200
      - type: json_exists
        path: products
      - type: json_not_empty
        path: products
      - type: json_equals
        path: status
        value: ready
      # These content checks pass for both healthy and failed demo responses;
      # they demonstrate text/content-type evaluation without changing outcomes.
      - type: content_type_contains
        value: application/json
      - type: text_contains
        value: catalog-demo-01

  - name: fiscal_authorization
    application: demo-billing
    url: "${DEMO_API_URL:http://localhost:8001}/scenarios/fiscal-authorization"
    method: GET
    headers:
      X-Demo-Token: "${DEMO_TOKEN:demo-token}"
    interval_seconds: 10
    timeout_seconds: 2
    max_response_bytes: 2097152  # 2 MiB decoded body limit (default)
    assertions:
      - type: http_status
        value: 200
      # Standalone guard: a missing/null/false authorized state must never pass
      # merely because both conditional branches were skipped. Without it, an
      # all-skipped conditional tree would be unknown, not healthy.
      - type: json_equals
        path: authorized
        value: true
      # A false guard is not itself a business failure. Guards select branches but
      # are not counted as required business results. `otherwise`, when present,
      # is a required assertion when selected.
      - type: conditional
        when:
          type: json_equals
          path: authorized
          value: true
        then:
          type: json_exists
          path: authorization_code
      - type: conditional
        when:
          type: json_equals
          path: authorized
          value: true
        then:
          type: json_not_empty
          path: authorization_code

  - name: device_data_freshness
    application: demo-iot
    url: "${DEMO_API_URL:http://localhost:8001}/scenarios/device-data-freshness"
    method: GET
    headers:
      X-Demo-Token: "${DEMO_TOKEN:demo-token}"
    interval_seconds: 10
    timeout_seconds: 2
    max_response_bytes: 2097152  # 2 MiB decoded body limit (default)
    assertions:
      - type: http_status
        value: 200
      - type: json_equals
        path: status
        value: online
      - type: json_exists
        path: last_event_at
      - type: numeric_lt
        path: last_event_age_seconds
        value: 300

