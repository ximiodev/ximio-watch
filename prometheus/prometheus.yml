# Standalone demo configuration.
# Alerting is intentionally omitted so Prometheus does not repeatedly attempt to
# deliver notifications to an absent Alertmanager. The optional overlay mounts
# prometheus.alerting.yml instead.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: ximiowatch
    static_configs:
      - targets: ["ximiowatch:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
